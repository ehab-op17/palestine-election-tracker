name: Update election data

on:
  schedule:
    # Every 6 hours. PCPSR publishes polls every few months, not
    # continuously, so this is generous — tighten or loosen as you like.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper_backend/fetch_polls.py

      - name: Commit updated data if changed
        run: |
          git config user.name "election-data-bot"
          git config user.email "actions@github.com"
          git add data/fetched_data.json
          git diff --staged --quiet || git commit -m "chore: refresh election data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
